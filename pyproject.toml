[project]
name = "alfred-world-clock"
version = "2.3.0"
description = "Check time in multiple timezones."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9,<3.12"
authors = [
    { name = "Fede Calendino", email = "fede@calendino.com" },
]
dependencies = [
    "alfred-pyflow==0.4.6",
    "pytimeparse==1.1.8",
    "pytz==2023.3.post1",
]

[project.urls]
Homepage = "https://github.com/fedecalendino/alfred-world-clock"
Documentation = "https://github.com/fedecalendino/alfred-world-clock/blob/main/README.md"
Repository = "https://github.com/fedecalendino/alfred-world-clock"

[dependency-groups]
dev = [
    "black==23.11.0",
    "coverage==7.3.2",
    "ddt==1.7.2",
]

[tool.uv]
package = false

[tool.black]
line-length = 150
